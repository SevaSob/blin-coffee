{% extends "admin/base_admin.html" %}
{% block title %}Смена пароля — админ{% endblock %}

{% block admin_content %}
<div class="admin-header">
    <h1>Смена пароля</h1>
</div>

<form method="post" class="card p-4" style="max-width: 480px;">
    <div class="mb-3">
        <label class="form-label">Старый пароль</label>
        <input type="password" name="old" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Новый пароль</label>
        <input type="password" name="new" class="form-control" required minlength="4">
    </div>
    <div>
        <button class="btn btn-green">Сменить пароль</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
